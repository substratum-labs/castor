name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # allow publish.yml to reuse this workflow

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      - name: Check linting
        run: uv run ruff check src/ tests/

  kernel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Check Rust formatting and tests
        run: >-
          cargo fmt --manifest-path kernel/Cargo.toml --check &&
          cargo test --manifest-path kernel/Cargo.toml

      - name: Build the PyO3 extension wheel
        run: >-
          uvx --from maturin maturin build
          --manifest-path kernel/Cargo.toml --release
          -o /tmp/castor-kernel-wheel

      - name: Import and exercise the installed wheel
        run: >-
          uv run --with /tmp/castor-kernel-wheel/*.whl python -c
          'import castor_kernel; runtime = castor_kernel.KernelRuntime();
          runtime.grant("cap_a"); runtime.propose("effect_a");
          runtime.commit("effect_a"); assert runtime.agent_state == "running";
          assert runtime.cursor == 2'

  paper-a-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv sync --extra paper_a_eval
      - name: Run E0 and C-full two-fault tests
        run: >-
          uv run pytest -v --tb=short
          tests/test_kill_harness.py
          tests/test_paper_a_matrix.py::test_c_full_kill_after_commit_zero_dups
          tests/test_paper_a_matrix.py::test_c_full_kill_after_success_zero_dups
      - run: >-
          uv run python -m castor.evals.paper_a.matrix
          --out /tmp/castor-paper-a-smoke --label ci-smoke
          --systems c_full --faults kill_after_commit kill_after_success --trials 3
