name: CI

on:
  push:
    branches: [main]
  pull_request:  # stacked feature PRs also need the Linux physical gates
  workflow_call:  # allow publish.yml to reuse this workflow

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build castord for physical matrix tests
        run: cargo build --release --manifest-path kernel/Cargo.toml --bin castord

      - name: Build Castor A client wheel for release gate
        run: uv build --no-sources packages/castor-client

      - name: Run tests
        env:
          CASTORD_BINARY: ${{ github.workspace }}/kernel/target/release/castord
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v --tb=short

      - name: Run Castor A client unit tests
        env:
          PYTHONPATH: packages/castor-client/src
        run: >-
          uv run --python ${{ matrix.python-version }} python -m unittest discover
          packages/castor-client/tests -v

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check src/ tests/ packages/castor-client/src/ packages/castor-client/tests/ scripts/check_client_release.py

      - name: Check linting
        run: uv run ruff check src/ tests/ packages/castor-client/src/ packages/castor-client/tests/ scripts/check_client_release.py

  kernel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v4

      - name: Build pinned Python-free Pi carrier
        run: docker build --tag substratum/castor-pi-carrier:v1 kernel/carrier/pi

      - name: Exercise pinned Pi extension and two-turn CLI
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777
          --user 10001:10001
          --mount type=bind,src=${{ github.workspace }}/kernel/carrier/pi,dst=/opt/castor/src,readonly
          --entrypoint node substratum/castor-pi-carrier:v1
          --test /opt/castor/src/tests/protocol.test.js
          /opt/castor/src/tests/extension.test.js
          /opt/castor/src/tests/pi-cli-smoke.test.js

      - name: Set up Python
        run: uv python install 3.11

      - name: Check Rust formatting and tests
        run: >-
          cargo fmt --manifest-path kernel/Cargo.toml --check &&
          cargo clippy --manifest-path kernel/Cargo.toml --all-targets -- -D warnings &&
          cargo test --manifest-path kernel/Cargo.toml

      - name: Build the PyO3 extension wheel
        run: >-
          uvx --from maturin maturin build
          --manifest-path kernel/Cargo.toml --features extension-module --release
          -o /tmp/castor-kernel-wheel

      - name: Import and exercise the installed wheel
        run: >-
          uv run --with /tmp/castor-kernel-wheel/*.whl python -c
          'import castor_kernel; runtime = castor_kernel.KernelRuntime();
          runtime.grant("cap_a"); runtime.propose("effect_a");
          runtime.commit("effect_a"); assert runtime.agent_state == "running";
          assert runtime.cursor == 2'

  roche-a:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv sync
      - uses: dtolnay/rust-toolchain@stable
      - name: Build castord and the installed-wheel Agent image input
        run: >-
          cargo build --release --manifest-path kernel/Cargo.toml --bin castord &&
          uv build --no-sources packages/castor-client
      - name: Run physical Roche Agent socket trace
        env:
          CASTORD_BINARY: ${{ github.workspace }}/kernel/target/release/castord
          CASTOR_A_ROCHE_PHYSICAL: "1"
        run: uv run pytest -v --tb=short tests/test_castor_a_roche.py

  paper-a-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv sync --extra paper_a_eval
      - name: Run E0 and C-full two-fault tests
        run: >-
          uv run pytest -v --tb=short
          tests/test_kill_harness.py
          tests/test_paper_a_matrix.py::test_c_full_kill_after_commit_zero_dups
          tests/test_paper_a_matrix.py::test_c_full_kill_after_success_zero_dups
      - run: >-
          uv run python -m castor.evals.paper_a.matrix
          --out /tmp/castor-paper-a-smoke --label ci-smoke
          --systems c_full --faults kill_after_commit kill_after_success --trials 3
