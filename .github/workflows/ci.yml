name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # allow publish.yml to reuse this workflow

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      - name: Check linting
        run: uv run ruff check src/ tests/

  paper-a-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv sync --extra paper_a_eval
      - name: Run E0 and C-full two-fault tests
        run: >-
          uv run pytest -v --tb=short
          tests/test_kill_harness.py
          tests/test_paper_a_matrix.py::test_c_full_kill_after_commit_zero_dups
          tests/test_paper_a_matrix.py::test_c_full_kill_after_success_zero_dups
      - run: >-
          uv run python -m castor.evals.paper_a.matrix
          --out /tmp/castor-paper-a-smoke --label ci-smoke
          --systems c_full --faults kill_after_commit kill_after_success --trials 3
