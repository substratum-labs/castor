name: Publish Castor Client to PyPI

on:
  push:
    tags: ["client-v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-client:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Build only the Castor A client
        run: uv build --no-sources packages/castor-client

      - name: Verify tag and distribution contents
        run: uv run python scripts/check_client_release.py

      - name: Preserve verified client distributions
        uses: actions/upload-artifact@v4
        with:
          name: castor-client-dist
          path: |
            packages/castor-client/dist/*.whl
            packages/castor-client/dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: ${{ vars.CASTOR_CLIENT_PUBLISH_ENABLED == 'true' }}
    needs: build-client
    runs-on: ubuntu-latest
    environment: pypi-client
    permissions:
      id-token: write

    steps:
      - name: Retrieve verified client distributions
        uses: actions/download-artifact@v4
        with:
          name: castor-client-dist
          path: dist

      - name: Publish client to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
