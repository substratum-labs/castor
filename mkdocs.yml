site_name: Castor
site_description: A secure microkernel for LLM Agents
site_url: https://substrate-lab.github.io/castor
repo_url: https://github.com/substrate-lab/castor
repo_name: substrate-lab/castor

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - API Reference:
      - Overview: api/index.md
      - Castor Kernel: api/kernel.md
      - SyscallProxy: api/proxy.md
      - Data Models: api/models.md
      - Gate (Tools): api/gate.md
      - Capabilities: api/capability.md
      - HITL: api/hitl.md
      - LLM Wrappers: api/llm.md
      - MMU (Memory): api/mmu.md
      - Runner & Persistence: api/runner.md
      - Agent Registry: api/agents.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
