[project]
name = "castor-kernel"
version = "0.5.1"
description = "A secure microkernel for LLM Agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Substratum Labs" },
]
keywords = ["llm", "agents", "microkernel", "checkpoint", "hitl", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
smolagents = [
    "smolagents>=1.0",
]
pydantic_ai = [
    "pydantic-ai>=0.1",
]
langchain = [
    "langchain-core>=0.2",
    "langgraph>=0.2",
]
crewai = [
    "crewai>=0.80",
]
openai_agents = [
    "openai-agents>=0.1",
]
autogen = [
    "autogen-agentchat>=0.4",
    "autogen-core>=0.4",
]
google_adk = [
    "google-adk>=0.1",
]
# NOTE: mnemos is the sister project at github.com/substratum-labs/mnemos.
# It is not yet on PyPI; install locally with `uv pip install -e ../mnemos`.
# This optional group is intentionally empty so that resolvers don't try to
# pull in an unrelated PyPI package named "mnemos".
mnemos = []
demo = [
    "rich>=13.0",
    "litellm>=1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
mcp = [
    "fastmcp>=3.1.0",
]

[project.scripts]
castor = "castor.cli:main"
castor-mcp = "castor.mcp.server:main"

[project.urls]
Homepage = "https://github.com/substratum-labs/castor"
Repository = "https://github.com/substratum-labs/castor"
Documentation = "https://substratum-labs.github.io/castor/"
Issues = "https://github.com/substratum-labs/castor/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "hypothesis>=6.0",
    "pydantic-ai>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/castor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["N999"]  # numbered filenames are intentional
