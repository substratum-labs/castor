[package]
name = "castor-kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "castor_kernel"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "castord"
path = "src/bin/castord.rs"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
vstd = "=0.0.0-2026-07-12-0122"
roche-core = { path = "../../../../roche/crates/roche-core" }
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3.23"

[package.metadata.verus]
verify = true
